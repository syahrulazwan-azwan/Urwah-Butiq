<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B1A92">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kasbon Kantin – Urwah Butiq</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <img class="logo" src="assets/logo.png" alt="Logo toko">
    <div class="brand">
      <span id="toko" class="brand-name">Urwah Butiq</span>
      <span id="subjudul" class="brand-sub">Twins Collection</span>
    </div>
    <span class="spacer"></span>
    <button id="status" class="status" type="button" data-act="kirimUlang">
      <span class="dot"></span><span id="statusText">Tersambung</span>
    </button>
    <button id="btnTanggal" class="date-btn" type="button" data-act="pilihTanggal">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span id="tanggalLabel"></span>
    </button>
    <input id="inputTanggal" class="date-input" type="date" aria-label="Pilih tanggal" tabindex="-1">
    <nav class="mainnav" aria-label="Menu utama">
      <button type="button" class="navbtn" data-act="nav" data-view="kasir">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg>
        <span>Kasir</span>
      </button>
      <button type="button" class="navbtn" data-act="nav" data-view="rekap">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"></path><path d="M7 16v-5"></path><path d="M12 16V6"></path><path d="M17 16v-8"></path></svg>
        <span>Rekap</span>
      </button>
      <button type="button" class="navbtn" data-act="nav" data-view="admin">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9"></path><path d="M18 7h2"></path><circle cx="15.5" cy="7" r="2.5"></circle><path d="M4 17h3"></path><path d="M12 17h8"></path><circle cx="9.5" cy="17" r="2.5"></circle></svg>
        <span>Admin</span>
      </button>
    </nav>
  </header>

  <!-- ================= KASIR ================= -->
  <main id="view-kasir" class="view kasir">
    <section class="panel">
      <div class="step"><span class="num">1</span><h2>Pilih nama</h2></div>
      <label class="search">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="cariNama" type="search" placeholder="Cari nama…" aria-label="Cari nama" autocomplete="off">
      </label>
      <div id="listNama" class="list-nama"></div>
      <button type="button" class="btn-dashed" data-act="namaBaru">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Nama baru</span>
      </button>
    </section>

    <section class="panel">
      <div class="step-row">
        <div class="step"><span class="num">2</span><h2>Ketuk barang</h2></div>
        <div id="tabs" class="tabs"></div>
      </div>
      <div id="gridBarang" class="grid-barang"></div>
    </section>

    <section class="panel">
      <div class="step-row">
        <div class="step"><span class="num">3</span><h2>Periksa, lalu kirim</h2></div>
        <button type="button" class="btn-ghost" data-act="riwayat">Riwayat</button>
      </div>
      <div id="tglPeringatan" class="warn-box" hidden></div>
      <div class="pengambil">
        <span>Pengambil</span>
        <strong id="namaDipilih">Belum dipilih</strong>
      </div>
      <div id="keranjang" class="keranjang"></div>
      <div class="total-row"><span>Total</span><strong id="totalLabel">Rp 0</strong></div>
      <button id="btnKirim" type="button" class="btn-kirim" data-act="kirim">Pilih nama dulu</button>
    </section>
  </main>

  <!-- ================= REKAP ================= -->
  <main id="view-rekap" class="view rekap" hidden></main>

  <!-- ================= ADMIN ================= -->
  <main id="view-admin" class="view admin" hidden></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="print-area"></div>
<input id="inputFoto" type="file" accept="image/*" hidden>

<script src="js/config.js"></script>
<script src="js/vendor/jspdf.umd.min.js" defer></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
